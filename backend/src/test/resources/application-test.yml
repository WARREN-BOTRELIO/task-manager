spring:
  datasource:
    url: jdbc:h2:mem:taskdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    # Test-only secret (>= 32 bytes). Never used outside the test scope.
    secret: test-only-jwt-secret-0123456789abcdef-please-change
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    org.springframework: WARN
    com.taskmanager: INFO